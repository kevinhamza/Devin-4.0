[pytest]
# Several test modules predate this convention and use a "*_tests.py" suffix
# instead of pytest's default "test_*.py" / "*_test.py" (e.g. ai_tests.py,
# robotics_tests.py, analytics_tests.py) -- without this, pytest silently
# never collects them, and neither does CI (.github/workflows/devin-ci.yml
# just runs `pytest tests/` with no override).
python_files = test_*.py *_test.py *_tests.py
